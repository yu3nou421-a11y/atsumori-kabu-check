<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森のカブ価チェック</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(#cbe9d7,#e7f0d0);color:#385b3f;padding:22px 12px 50px}.wrap{max-width:570px;margin:auto}.trees{text-align:center;font-size:30px;letter-spacing:20px;margin:14px 0 20px}.panel{background:#fffdf0;border:6px solid #f6edcb;border-radius:32px;padding:20px 12px 25px;box-shadow:0 9px #a6c49a}h1{text-align:center;font-size:clamp(21px,5.5vw,31px);margin:8px 0 10px}.sub{text-align:center;color:#70896b;font-size:14px;line-height:1.7}.status{display:flex;justify-content:space-between;background:#eaf3dc;padding:12px 15px;border-radius:22px;font-weight:700;margin:22px 0 9px}.track{height:10px;background:#d7e5c9;border-radius:20px;overflow:hidden;margin-bottom:19px}.fill{height:100%;width:0;background:#6db588;transition:width .15s}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.time{font-size:clamp(13px,3.4vw,19px);font-weight:750;padding:15px 1px;min-width:0;border:2px solid #c8dbc2;background:#fff;border-radius:13px;color:#42664c;touch-action:manipulation}.time.checked,.save.checked{background:#78b78a;color:white;border-color:#509969}.save{width:100%;margin-top:19px;border:2px solid #b9945e;border-radius:17px;background:#f7e3b6;color:#78572d;font-size:19px;font-weight:800;padding:16px 6px;touch-action:manipulation}.note{text-align:center;font-size:12px;color:#738c6d;margin:13px 0}.reset{display:block;margin:18px auto 0;border:2px solid #a7c8a3;border-radius:40px;background:transparent;color:#4b7b57;padding:11px 17px;font-size:14px;font-weight:700}.footer{text-align:center;margin:27px 0;color:#67886a;font-weight:bold;font-size:14px}button:focus-visible{outline:3px solid #d19a45;outline-offset:2px}</style></head><body><main class="wrap"><div class="trees">🌳 🍃 🌲</div><section class="panel"><h1>🌱 カブ価 時間チェック</h1><p class="sub">12:30 → 12:00まで1分ずつチェック♪<br>タッチすると緑色になるよ！</p><div class="status"><span>🍀 チェック状況</span><span id="count">0 / 31</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="grid"><button type="button" class="time" data-minute="30" onclick="toggleMinute(30)">12:30</button>
<button type="button" class="time" data-minute="29" onclick="toggleMinute(29)">12:29</button>
<button type="button" class="time" data-minute="28" onclick="toggleMinute(28)">12:28</button>
<button type="button" class="time" data-minute="27" onclick="toggleMinute(27)">12:27</button>
<button type="button" class="time" data-minute="26" onclick="toggleMinute(26)">12:26</button>
<button type="button" class="time" data-minute="25" onclick="toggleMinute(25)">12:25</button>
<button type="button" class="time" data-minute="24" onclick="toggleMinute(24)">12:24</button>
<button type="button" class="time" data-minute="23" onclick="toggleMinute(23)">12:23</button>
<button type="button" class="time" data-minute="22" onclick="toggleMinute(22)">12:22</button>
<button type="button" class="time" data-minute="21" onclick="toggleMinute(21)">12:21</button>
<button type="button" class="time" data-minute="20" onclick="toggleMinute(20)">12:20</button>
<button type="button" class="time" data-minute="19" onclick="toggleMinute(19)">12:19</button>
<button type="button" class="time" data-minute="18" onclick="toggleMinute(18)">12:18</button>
<button type="button" class="time" data-minute="17" onclick="toggleMinute(17)">12:17</button>
<button type="button" class="time" data-minute="16" onclick="toggleMinute(16)">12:16</button>
<button type="button" class="time" data-minute="15" onclick="toggleMinute(15)">12:15</button>
<button type="button" class="time" data-minute="14" onclick="toggleMinute(14)">12:14</button>
<button type="button" class="time" data-minute="13" onclick="toggleMinute(13)">12:13</button>
<button type="button" class="time" data-minute="12" onclick="toggleMinute(12)">12:12</button>
<button type="button" class="time" data-minute="11" onclick="toggleMinute(11)">12:11</button>
<button type="button" class="time" data-minute="10" onclick="toggleMinute(10)">12:10</button>
<button type="button" class="time" data-minute="9" onclick="toggleMinute(9)">12:09</button>
<button type="button" class="time" data-minute="8" onclick="toggleMinute(8)">12:08</button>
<button type="button" class="time" data-minute="7" onclick="toggleMinute(7)">12:07</button>
<button type="button" class="time" data-minute="6" onclick="toggleMinute(6)">12:06</button>
<button type="button" class="time" data-minute="5" onclick="toggleMinute(5)">12:05</button>
<button type="button" class="time" data-minute="4" onclick="toggleMinute(4)">12:04</button>
<button type="button" class="time" data-minute="3" onclick="toggleMinute(3)">12:03</button>
<button type="button" class="time" data-minute="2" onclick="toggleMinute(2)">12:02</button>
<button type="button" class="time" data-minute="1" onclick="toggleMinute(1)">12:01</button>
<button type="button" class="time" data-minute="0" onclick="toggleMinute(30)">12:00</button></div><button type="button" id="save" class="save" onclick="toggleMinute(0)">💾 セーブ</button><p class="note">12:30 と セーブは同時に色が変わるよ！</p><button type="button" class="reset" onclick="resetChecks()">🔄 チェックを全部リセット</button></section><div class="footer">🌼 のんびり、カブ価チェック 🌼</div></main><script>
(function(){var key='kabu-forest-static-v1';var selected=[];try{var stored=JSON.parse(localStorage.getItem(key));if(Array.isArray(stored))selected=stored.filter(function(n){return Number.isInteger(n)&&n>=0&&n<=30;});}catch(e){}window.toggleMinute=function(n){var i=selected.indexOf(n);if(i===-1)selected.push(n);else selected.splice(i,1);render();};window.resetChecks=function(){if(confirm('チェックを全部消す？')){selected=[];render();}};function render(){document.querySelectorAll('.time').forEach(function(b){var active=selected.indexOf(Number(b.getAttribute('data-minute')))!==-1;b.classList.toggle('checked',active);b.setAttribute('aria-pressed',String(active));});var save=document.getElementById('save');save.classList.toggle('checked',selected.indexOf(30)!==-1);save.setAttribute('aria-pressed',String(selected.indexOf(30)!==-1));document.getElementById('count').textContent=selected.length+' / 31';document.getElementById('fill').style.width=(selected.length/31*100)+'%';try{localStorage.setItem(key,JSON.stringify(selected));}catch(e){}}render();})();
</script></body></html>
